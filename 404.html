<style>
/* variables */
:root {
color-scheme: light dark;
--accent-color: #FFD60A; /* vibrant yellow */
--accent-highlight-color: #FFF899; /* lemon tint */
--border-background-color: var(--accent-color);
--font-family-sans-serif: -apple-system, BlinkMacSystemFont, SF Pro Text, SF Pro, system-ui, sans-serif;
--font-family-script: Snell Roundhand, Segoe Script, cursive;
--link-color: #094696; /* dull blue */
--link-visited-color: #5C6773; /* muted slate grey */
--page-color: white;
--secondary-element-color: #CBD3DC; /* cool slate */
--site-background-color: #E2E7ED; /* light grey with subtle blue tinge */
--text-color: black;
--title-background-color: var(--text-color);
--title-text-color: var(--page-color);
}

@media screen and (prefers-color-scheme: dark) {
:root {
--accent-highlight-color: #383204; /* dark yellow */
--link-color: #6E96CF; /* dull slate blue */
--link-visited-color: #8B98A5; /* muted slate grey */
--page-color: #171D25; /* dark slate */
--secondary-element-color: #2B3542; /* steel slate */
--site-background-color: #0E1318; /* inky blue-black */
--text-color: #E6EDF3; /* soft high-contrast white */
--title-background-color: var(--site-background-color);
--title-text-color: var(--text-color);
}
}

html, body {
margin: 0;
}

body {
background-color: var(--page-color);
border-bottom: .5rem solid var(--border-background-color);
box-sizing: border-box;
color: var(--text-color);
display: flex;
flex-direction: column;
font-family: var(--font-family-sans-serif);
font-size: 120%; /* for mobile devices */
line-height: 1.5;
min-height: 100dvh;
}

a {
color: var(--link-color);
}

a:hover {
background-color: var(--accent-highlight-color);
color: var(--text-color);
}

a:visited {
color: var(--link-visited-color);
}

a:visited:hover {
color: var(--text-color);
}

a:hover::selection {
background-color: var(--secondary-element-color);
}

::selection { /* change text selection highlight colour */
background-color: var(--accent-highlight-color);
}

#content {
flex: 1;
}

main {
display: flex;
flex-wrap: wrap;
gap: 2rem;
padding: 1rem 2rem;
}

main > section {
flex: 1 1 240px;
}

main > section > p:first-child {
margin-top: 0;
}

header {
padding: 2rem 2rem 0;
}

footer {
align-self: flex-end;
padding: 2rem 2rem 1rem;
}

footer h1 {
background-color: var(--title-background-color);
box-shadow: .5rem .5rem var(--border-background-color);
color: var(--title-text-color);
display: table;
font-size: clamp(1rem, 7vw, 2.5rem);
font-style: italic;
font-weight: 900;
line-height: 1em;
margin: 0 0 1rem;
padding: .5em;
text-shadow: 0 -.02em .02em var(--border-background-color);
text-transform: uppercase;
}

#image {
text-align: center;
}

#image svg {
max-width: 100%;
width: 20rem;
}

#image h1 {
all: unset;
display: block;
font-family: var(--font-family-script);
font-size: 200%;
}

/* ------------------------------------------------------------------------------------ */
@media screen and (width > 720px) {
/* everything inside this media query, is designed for non-mobile devices */
#content {
flex: none;
margin-block: auto;
padding-block: 2rem;
}

header, footer {
padding-top: 0;
}

main {
margin: 0 auto;
max-width: 55ch;
}

#image h1 {
margin: 1rem 0;
}
}
</style>
