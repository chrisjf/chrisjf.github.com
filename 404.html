/* Base styles */
:root {
color-scheme: light dark;
--accent-color: #FFD60A; /* Vibrant yellow */
--box-shadow-offset: .5rem;
--decoration-color: #5C6773; /* Muted slate grey */
--decoration-secondary-color: #CBD3DC; /* Cool slate */

--font-family-script: "Snell Roundhand", "Apple Chancery", cursive;

--navigation-separator-gap: .5rem;
--page-background-color: white;
--page-gutter: 2rem;
--page-vertical-whitespace: 1rem;
--text-color: black;
--text-highlight-background-color: #FFF899; /* Lemon tint */
--text-shadow-color: color-mix(in srgb, var(--page-background-color) 50%, transparent);
--title-background-color: #0E1318; /* Inky blue-black */
--title-letter-spacing: -.04em;
--title-text-color: var(--page-background-color);
}

@media screen and (prefers-color-scheme: dark) {

:root {
--decoration-color: #8B98A5; /* Muted slate grey */
--decoration-secondary-color: #2B3542; /* Steel slate */
--link-color: #6E96CF; /* Dull slate blue */
--page-background-color: #171D25; /* Dark slate */
--text-color: #E6EDF3; /* Soft white */
--text-highlight-background-color: #383204; /* Dark yellow */
--title-text-color: var(--text-color);
}

}

html, body {
margin: 0;
padding: 0;
}

body {
background-color: var(--page-background-color);
border-bottom: .5rem solid var(--accent-color);
box-sizing: border-box;
color: var(--text-color);
display: flex;
flex-direction: column;
font-family: var(--font-family-sans-serif);
font-size: 120%;
line-height: 160%;
min-height: 100svh;
text-shadow: 0 1px 1px var(--text-shadow-color);
}

::selection {
background-color: var(--text-highlight-background-color);
}

a {
border-bottom: 1px solid var(--link-underline-color);
color: var(--link-color);
text-decoration: none;
}

a:visited {
color: var(--link-visited-color);
}

a:hover {
border-bottom-color: var(--text-color);
color: var(--text-color);
}

a:focus-visible {
outline: 2px solid var(--link-color);
outline-offset: .2em;
}

#content {
flex: 1;
}

main {
display: flex;
flex-wrap: wrap;
gap: var(--page-gutter);
padding: var(--page-vertical-whitespace) var(--page-gutter);
}

main > section {
flex: 1 1 240px;
}

main > section > p:first-child {
margin-bottom: var(--page-vertical-whitespace);
margin-top: 0;
}

main > section > a {
position: relative;
}

main > section > a::before {
content: "\2039" / "";
inset-inline-end: 100%;
margin-inline-end: var(--navigation-separator-gap);
position: absolute;
}

header {
padding: var(--page-gutter) var(--page-gutter) 0;
}

footer {
align-self: flex-end;
box-sizing: border-box;
max-width: 100%;
padding: var(--page-gutter);
padding-bottom: calc(var(--page-gutter) + var(--box-shadow-offset));
padding-right: calc(var(--page-gutter) + var(--box-shadow-offset));
}

footer h1 {
background-color: var(--title-background-color);
box-sizing: border-box;
color: var(--title-text-color);
font-size: clamp(1rem, 7vw, 2.5rem);
font-style: italic;
font-weight: 900;
isolation: isolate;
letter-spacing: var(--title-letter-spacing);
line-height: 100%;
margin: 0;
max-width: 100%;
overflow-wrap: anywhere;
padding: .625em;
position: relative;
text-shadow: 0 -.02em .02em var(--accent-color);
text-transform: uppercase;
width: fit-content;
}

footer h1::after {
background-color: var(--accent-color);
clip-path: polygon(calc(100% - var(--box-shadow-offset)) 0, 100% var(--box-shadow-offset), 100% 100%, var(--box-shadow-offset) 100%, 0 calc(100% - var(--box-shadow-offset)), calc(100% - var(--box-shadow-offset)) calc(100% - var(--box-shadow-offset)));
content: "";
inset: 0 calc(-1 * var(--box-shadow-offset)) calc(-1 * var(--box-shadow-offset)) 0;
pointer-events: none;
position: absolute;
z-index: -1;
}

#image {
text-align: center;
}

#image svg {
max-width: 100%;
width: 20rem;
}

#image h1 {
all: unset;
display: block;
font-family: var(--font-family-script);
font-size: 200%;
margin-block: var(--page-vertical-whitespace);
}

/* ------------------------------------------------------------------------------------ */
/* Desktop styles */
@media screen and (width > 720px) {
#content {
flex: none;
margin-block: auto;
padding-block: calc(2 * var(--page-vertical-whitespace));
}

header {
padding-top: 0;
}

main {
margin: 0 auto;
max-width: 55ch;
}
}
</style>
