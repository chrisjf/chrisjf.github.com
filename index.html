<!DOCTYPE html>
<html lang=en-CA>
<head>

<meta charset=utf-8>
<title>christophe.ca</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg">

<style>

:root {
color-scheme: light;
--dither-filter: none;
--page-text-shadow: 0 1px 1px rgba(255,255,255,.5);
--site-background-color: #FFD60A;
--text-color: #000000;
}

:root[data-theme="dark"] {
color-scheme: dark;
--dither-filter: invert(1);
--page-text-shadow: none;
--site-background-color: #0E1318;
--text-color: #E6EDF3;
}

html, body {
margin: 0;
padding: 0;
}

html {
background-color: var(--site-background-color);
background-image: linear-gradient(to bottom, rgb(255 255 255 / 10%), transparent);
height: 100%;
}

body {
color: var(--text-color);
font-family: Helvetica Neue, Arial, serif;
font-size: x-large;
height: 100%;
text-shadow: var(--page-text-shadow); /* Inspiration: http://owltastic.com/2009/12/shadows-and-css3/ */
}

body::before {
background: repeat url("style/dither.svg") top left;
content: "";
filter: var(--dither-filter);
inset: 0;
pointer-events: none;
position: fixed;
}

#page {
bottom: 30%;
left: 55%;
position: absolute;
}

h1, h2 {
font-weight: normal;
margin: 0;
padding: 0;
}

h1 {
color: white;
font-weight: 500;
text-shadow: 0px 1px 1px rgba(0,0,0,.2);
}

@media screen and (max-width: 1049px) {
h1 { font-size: 200%; }
h2 { font-size: 150%; }
}
@media screen and (max-width: 800px) {
h1 { font-size: 150%; }
h2 { font-size: 125%; }
}
@media screen and (max-width: 600px) {
h1 { font-size: 120%; }
h2 { font-size: 110%; }
}

</style>

</head>
<body>
<div id=page>

<div id=outer>
<div id=inner>

<h1>Christophe.ca</h1>

<h2>Nothing to see here. Move along folks.</h2>
<h2></h2>

</div><!-- / outer -->
</div><!-- / inner -->

</div> <!-- / page -->
</body>
</html>
